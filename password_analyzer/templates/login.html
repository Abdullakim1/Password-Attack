
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center">Login System Demo</h3>
                <p class="text-muted text-center">Register new users or login to existing accounts</p>
                
                <ul class="nav nav-tabs" id="loginTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Register</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="reset-tab" data-bs-toggle="tab" data-bs-target="#reset" type="button" role="tab">Reset Account</button>
                    </li>
                </ul>
                
                <div class="tab-content mt-3" id="loginTabContent">
                    <div class="tab-pane fade show active" id="login" role="tabpanel">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="loginUsername" class="form-label">Username</label>
                                <input type="text" class="form-control" id="loginUsername" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="loginPassword" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                    
                    <div class="tab-pane fade" id="register" role="tabpanel">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="regUsername" class="form-label">Username</label>
                                <input type="text" class="form-control" id="regUsername" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="regPassword" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="regConfirmPassword" name="confirm_password" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Register</button>
                        </form>
                    </div>
                    
                    <div class="tab-pane fade" id="reset" role="tabpanel">
                        <form id="resetForm">
                            <div class="mb-3">
                                <label for="resetUsername" class="form-label">Username to Reset</label>
                                <input type="text" class="form-control" id="resetUsername" name="username" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Reset Account</button>
                        </form>
                    </div>
                </div>
                
                <div id="loginResults" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    handleLoginAction('/api/login', new FormData(this));
});

document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    if (formData.get('password') !== formData.get('confirm_password')) {
        showResult('Passwords do not match!', 'danger');
        return;
    }
    handleLoginAction('/api/register', formData);
});

document.getElementById('resetForm').addEventListener('submit', function(e) {
    e.preventDefault();
    handleLoginAction('/api/reset', new FormData(this));
});

function handleLoginAction(url, formData) {
    const resultsDiv = document.getElementById('loginResults');
    
    fetch(url, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showResult(data.message, 'success');
        } else {
            showResult(data.message, 'danger');
        }
    })
    .catch(error => {
        showResult('Error: ' + error.message, 'danger');
    });
}

function showResult(message, type) {
    const resultsDiv = document.getElementById('loginResults');
    resultsDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    setTimeout(() => {
        resultsDiv.innerHTML = '';
    }, 5000);
}
</script>
{% endblock %}
