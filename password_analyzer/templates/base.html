<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Security Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; }
        .strength-very-weak { color: #dc3545; }
        .strength-weak { color: #fd7e14; }
        .strength-fair { color: #ffc107; }
        .strength-strong { color: #28a745; }
        .strength-very-strong { color: #17a2b8; }
        .pattern-item { background-color: #f8f9fa; padding: 0.25rem 0.5rem; margin: 0.25rem; border-radius: 0.25rem; }
        .footer { margin-top: 50px; padding: 20px 0; border-top: 1px solid #dee2e6; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Password Security Analyzer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">Login System</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('analyze_password') }}">Analyze Password</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('crack_password') }}">Crack Password</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('benchmark_page') }}">Benchmark</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('results_page') }}">Results</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer text-center text-muted">
        <div class="container">
            <p>&copy; 2024 Password Security Analyzer - Educational Tool</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
